# giode.toml configures how the giode CLI builds this app.
# Reference: https://github.com/xmhrnx/giode-cli#giodetoml

[app]
name = "DocLens"
id = "com.xmhrnx.doclens"     # reverse-DNS, unique to the app; stores never let it change
version = "1.0.0"
build = 1                    # raise for every store upload (giode bump)
icon = "assets/icon.png"
package = "."
platforms = ["android", "ios"]
share_target = true          # appear in the share sheet: shared pictures and PDFs become documents
publisher = "Mehran Zahiroddini"
description = "Scan documents with your phone: automatic edge detection, perspective correction, filters, signatures and password-protected PDFs."
website = ""
licenses = "assets/licenses.json"   # refreshed on every build, shown in Settings

[android]
min_sdk = 24
# giode's camera package adds the CAMERA permission and the biometric
# package USE_BIOMETRIC; text recognition bundles ML Kit. The camera is
# optional so tablets without one can still import pictures and PDFs.
manifest = '<uses-feature android:name="android.hardware.camera" android:required="false"/>'
icon_foreground = "assets/android-foreground.png"   # adaptive icon layers, from assets/icon-source/make.py
icon_background = "assets/android-background.png"
icon_monochrome = "assets/android-monochrome.png"
java = ["android/java"]       # PdfPages.java: renders PDF pages for "Import PDF"
# keystore = "release.keystore"   # created by giode keystore; signs giode build -release

[ios]
min_os = 15

[ios.usage]
camera = "DocLens uses the camera to scan documents."
photos = "DocLens turns photos you pick into scans."
photos_add = "DocLens saves scanned pages to your photo library when you ask."
faceid = "DocLens can unlock your documents with Face ID."

[ci]
trigger = "release"                    # build only when a GitHub release is published
test = "go vet ./... && go test ./..."
