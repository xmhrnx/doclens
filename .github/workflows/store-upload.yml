# Uploads a release's builds to the stores once the release workflow
# (written by `giode ci` from giode.toml) has attached them. Each store is
# skipped until its secrets are set; see RELEASING.md.
#
# Google Play: the .aab goes to the internal testing track as a draft,
# with its native debug symbols. Play only accepts API uploads once the
# app exists in Play Console and a first bundle was uploaded there by hand.
#
# App Store: the .ipa goes to App Store Connect, where it shows up in
# TestFlight and can be submitted for review.
name: store upload

on:
  workflow_run:
    workflows: [release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to upload (e.g. v1.0.0)
        required: true

permissions:
  contents: read

jobs:
  google-play:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag || github.event.workflow_run.head_branch }}
    steps:
      - name: Download the bundle
        if: env.PLAY_SERVICE_ACCOUNT_JSON != ''
        run: |
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p '*.aab' -p 'native-debug-symbols.zip'
          ls -l
      - name: Upload to the internal testing track
        if: env.PLAY_SERVICE_ACCOUNT_JSON != ''
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.xmhrnx.goscan
          releaseFiles: '*.aab'
          debugSymbols: native-debug-symbols.zip
          track: internal
          status: draft
      - name: Skipped
        if: env.PLAY_SERVICE_ACCOUNT_JSON == ''
        run: echo "::notice::No PLAY_SERVICE_ACCOUNT_JSON secret; upload the .aab from the release in Play Console."

  app-store:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: macos-latest
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag || github.event.workflow_run.head_branch }}
    steps:
      - name: Upload to App Store Connect
        if: env.ASC_KEY_ID != '' && env.ASC_ISSUER_ID != '' && env.ASC_KEY_P8 != ''
        run: |
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p '*.ipa'
          ipa=$(ls *.ipa | head -n 1)
          if [ -z "$ipa" ]; then
            echo "::error::The release has no .ipa: the iOS build needs its signing secrets (see RELEASING.md)."
            exit 1
          fi
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8
          xcrun altool --upload-app --type ios -f "$ipa" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
      - name: Skipped
        if: env.ASC_KEY_ID == '' || env.ASC_ISSUER_ID == '' || env.ASC_KEY_P8 == ''
        run: echo "::notice::No App Store Connect API key secrets; upload the .ipa with Transporter."
